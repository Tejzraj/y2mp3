<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="100%" height="100%">
  <defs>
    <!-- Dark Tech Canvas Gradient -->
    <linearGradient id="canvasGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0D10"/>
      <stop offset="100%" stop-color="#11151A"/>
    </linearGradient>

    <!-- Glowing Conduits -->
    <linearGradient id="orangeFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF7A00"/>
      <stop offset="100%" stop-color="#FFAA00"/>
    </linearGradient>

    <linearGradient id="cyanFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D9FF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Subtle Tech Grid -->
    <pattern id="gridPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#161B22" stroke-width="0.75"/>
    </pattern>

    <!-- Node Glow Filter -->
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: -apple-system, BlinkMacSystemFont, 'SF Mono', 'JetBrains Mono', Consolas, monospace; }
    .title { font-weight: 700; font-size: 13px; fill: #F5F7FA; }
    .sub { font-size: 10px; fill: #8B949E; }
    .tag { font-size: 9px; font-weight: 600; letter-spacing: 0.5px; }
  </style>

  <!-- Background Canvas -->
  <rect width="820" height="440" rx="12" fill="url(#canvasGrad)" stroke="#1F242D" stroke-width="1.2"/>
  <rect width="820" height="440" rx="12" fill="url(#gridPattern)"/>

  <!-- Top Accent Bar -->
  <path d="M 0 12 Q 0 0 12 0 L 808 0 Q 820 0 820 12" fill="none" stroke="#FF7A00" stroke-width="2" opacity="0.85"/>

  <!-- Top Metadata Info -->
  <g transform="translate(24, 24)">
    <circle cx="0" cy="0" r="4" fill="#FF7A00" filter="url(#softGlow)"/>
    <text x="12" y="3" class="mono" font-size="11" font-weight="700" fill="#FF7A00">y2mp3</text>
    <text x="56" y="3" class="mono" font-size="11" fill="#4B5563">::</text>
    <text x="72" y="3" class="mono" font-size="10.5" fill="#8B949E">SYSTEM ARCHITECTURE &amp; EXECUTION TOPOLOGY</text>
  </g>

  <!-- ==================== STAGE 1: INPUT ==================== -->
  <g transform="translate(320, 48)">
    <rect width="180" height="48" rx="8" fill="#11151A" stroke="#2D333F" stroke-width="1.2"/>
    <rect x="1" y="1" width="178" height="16" rx="7" fill="#161B22"/>
    <text x="10" y="12" class="mono tag" fill="#00D9FF">INPUT QUEUE</text>
    <text x="10" y="34" class="mono title">storage/links.txt</text>
  </g>

  <!-- Connector: Input -> Router -->
  <path d="M 410 96 L 410 124" fill="none" stroke="#00D9FF" stroke-width="1.8"/>
  <polygon points="410,128 406,120 414,120" fill="#00D9FF"/>

  <!-- ==================== STAGE 2: CLI ROUTER ==================== -->
  <g transform="translate(290, 128)">
    <rect width="240" height="52" rx="8" fill="#11151A" stroke="#FF7A00" stroke-width="1.2" filter="url(#softGlow)"/>
    <rect x="1" y="1" width="238" height="16" rx="7" fill="#1C1813"/>
    <text x="10" y="12" class="mono tag" fill="#FF7A00">CLI ROUTER // main.py</text>
    <text x="10" y="34" class="mono title">--engine Selector</text>
    <text x="10" y="46" class="mono sub">Validates dependencies &amp; queue</text>
  </g>

  <!-- Branch Conduits: Router -> Engines -->
  <!-- Left Branch (Direct) -->
  <path d="M 330 180 L 330 206 L 220 206 L 220 226" fill="none" stroke="#FF7A00" stroke-width="1.8"/>
  <polygon points="220,230 216,222 224,222" fill="#FF7A00"/>
  <text x="230" y="218" class="mono tag" fill="#FF7A00">--engine direct</text>

  <!-- Right Branch (Web) -->
  <path d="M 490 180 L 490 206 L 600 206 L 600 226" fill="none" stroke="#00D9FF" stroke-width="1.8"/>
  <polygon points="600,230 596,222 604,222" fill="#00D9FF"/>
  <text x="508" y="218" class="mono tag" fill="#00D9FF">--engine web</text>

  <!-- ==================== STAGE 3A: DIRECT ENGINE ==================== -->
  <g transform="translate(100, 230)">
    <rect width="240" height="56" rx="8" fill="#11151A" stroke="#FF7A00" stroke-width="1.2"/>
    <rect x="1" y="1" width="238" height="16" rx="7" fill="#1C1813"/>
    <text x="10" y="12" class="mono tag" fill="#FF7A00">PRIMARY // core/direct_engine.py</text>
    <text x="10" y="34" class="mono title">yt-dlp Direct Stream</text>
    <text x="10" y="48" class="mono sub">Direct stream demuxing + thumbnail</text>
  </g>

  <!-- ==================== STAGE 3B: WEB ENGINE ==================== -->
  <g transform="translate(480, 230)">
    <rect width="240" height="56" rx="8" fill="#11151A" stroke="#00D9FF" stroke-width="1.2"/>
    <rect x="1" y="1" width="238" height="16" rx="7" fill="#0F1B24"/>
    <text x="10" y="12" class="mono tag" fill="#00D9FF">FALLBACK // core/web_engine.py</text>
    <text x="10" y="34" class="mono title">Playwright Web Scraper</text>
    <text x="10" y="48" class="mono sub">flagaflaga.pl automation + ad blocker</text>
  </g>

  <!-- Convergence to FFmpeg & Processing -->
  <!-- Direct to Transcode -->
  <path d="M 220 286 L 220 310 L 370 310 L 370 322" fill="none" stroke="#FF7A00" stroke-width="1.6"/>
  <polygon points="370,326 366,318 374,318" fill="#FF7A00"/>

  <!-- Web to Transcode / Direct output -->
  <path d="M 600 286 L 600 310 L 450 310 L 450 322" fill="none" stroke="#00D9FF" stroke-width="1.6"/>
  <polygon points="450,326 446,318 454,318" fill="#00D9FF"/>

  <!-- ==================== STAGE 4: FFMPEG TRANSCODE & METADATA ==================== -->
  <g transform="translate(260, 326)">
    <rect width="300" height="42" rx="8" fill="#11151A" stroke="#A855F7" stroke-width="1.2"/>
    <text x="14" y="20" class="mono title">FFmpeg Transcoder &amp; Mutagen ID3</text>
    <text x="14" y="33" class="mono sub">320 kbps MP3 conversion • Title, Artist, Cover Art</text>
  </g>

  <!-- Connector: Transcode -> Output -->
  <path d="M 410 368 L 410 388" fill="none" stroke="#22C55E" stroke-width="1.8"/>
  <polygon points="410,392 406,384 414,384" fill="#22C55E"/>

  <!-- ==================== STAGE 5: TARGET MP3 ==================== -->
  <g transform="translate(300, 392)">
    <rect width="220" height="34" rx="7" fill="#0B1A13" stroke="#22C55E" stroke-width="1.2" filter="url(#softGlow)"/>
    <circle cx="16" cy="17" r="4" fill="#22C55E"/>
    <text x="28" y="21" class="mono" font-size="12" font-weight="700" fill="#22C55E">storage/downloads/*.mp3</text>
  </g>
</svg>
