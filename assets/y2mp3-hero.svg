<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06070B"/>
      <stop offset="50%" stop-color="#0B0E17"/>
      <stop offset="100%" stop-color="#08090F"/>
    </linearGradient>

    <!-- Neon Glow Accents -->
    <linearGradient id="orangeGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5500"/>
      <stop offset="50%" stop-color="#FF7700"/>
      <stop offset="100%" stop-color="#FFAA00"/>
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>

    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7928CA"/>
      <stop offset="100%" stop-color="#FF0080"/>
    </linearGradient>

    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.2"/>
      <stop offset="40%" stop-color="#00E5FF"/>
      <stop offset="80%" stop-color="#FF7700"/>
      <stop offset="100%" stop-color="#FFAA00"/>
    </linearGradient>

    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Tech Grid Pattern -->
    <pattern id="techGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#161B26" stroke-width="0.8"/>
      <circle cx="30" cy="30" r="0.8" fill="#FF7700" fill-opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Roboto Mono', Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .pulse-bar { animation: pulse 2.4s ease-in-out infinite alternate; }
    @keyframes pulse {
      0% { transform: scaleY(0.75); }
      100% { transform: scaleY(1.05); }
    }
  </style>

  <!-- Base Panel -->
  <rect width="1000" height="340" rx="16" fill="url(#bgGrad)" stroke="#1F2430" stroke-width="1.5"/>
  <rect width="1000" height="340" rx="16" fill="url(#techGrid)"/>

  <!-- Top Ambient Glow Line -->
  <path d="M 0 16 Q 0 0 16 0 L 984 0 Q 1000 0 1000 16" fill="none" stroke="url(#orangeGlow)" stroke-width="2.5" opacity="0.9"/>

  <!-- Subdued Decorative Border Highlights -->
  <rect x="12" y="12" width="976" height="316" rx="10" fill="none" stroke="#00F0FF" stroke-width="0.6" stroke-opacity="0.2" stroke-dasharray="8 6"/>

  <!-- Terminal Header Bar -->
  <g transform="translate(30, 26)">
    <circle cx="0" cy="0" r="5" fill="#FF5F56"/>
    <circle cx="16" cy="0" r="5" fill="#FFBD2E"/>
    <circle cx="32" cy="0" r="5" fill="#27C93F"/>
    <text x="54" y="4" class="mono" font-size="11" fill="#4B5568" letter-spacing="1">SYSTEM://PIPELINE/CORE/ENGINE_ROUTER.V2</text>
    <rect x="800" y="-8" width="130" height="18" rx="4" fill="#0D1117" stroke="#FF7700" stroke-width="0.8" stroke-opacity="0.6"/>
    <circle cx="810" cy="1" r="3" fill="#00FF66" filter="url(#softGlow)"/>
    <text x="820" y="4" class="mono" font-size="9.5" fill="#00E5FF" font-weight="bold">SYSTEM ACTIVE</text>
  </g>

  <!-- Left Side: Main Brand & Wordmark -->
  <g transform="translate(50, 75)">
    <!-- Audio Waveform Decorative Motif Behind Title -->
    <path d="M 0 50 Q 30 10 60 50 T 120 50 T 180 50 T 240 50" fill="none" stroke="#FF5500" stroke-width="1.5" stroke-opacity="0.25"/>

    <!-- Main Title: y2mp3 -->
    <text x="0" y="55" class="mono" font-size="52" font-weight="900" fill="#FFFFFF" letter-spacing="-1">
      y2<tspan fill="url(#orangeGlow)">mp3</tspan>
    </text>

    <!-- Version Badge -->
    <g transform="translate(195, 22)">
      <rect width="64" height="20" rx="4" fill="#131722" stroke="#00E5FF" stroke-width="1" stroke-opacity="0.7"/>
      <text x="32" y="14" class="mono" font-size="10" fill="#00E5FF" text-anchor="middle" font-weight="bold">v2.0.0</text>
    </g>

    <!-- Subtitle / Architecture Descriptor -->
    <text x="2" y="86" class="mono" font-size="14" font-weight="600" fill="#00E5FF" letter-spacing="3.5">
      DUAL-ENGINE AUDIO PIPELINE
    </text>
    <text x="2" y="112" class="sans" font-size="13" fill="#8B949E" font-weight="400">
      Production-grade YouTube audio extraction, FFmpeg transcoding &amp; ID3 enrichment.
    </text>

    <!-- Feature Indicator Pills -->
    <g transform="translate(0, 138)">
      <!-- Pill 1: Direct Engine -->
      <g>
        <rect width="146" height="28" rx="6" fill="#0F131C" stroke="#FF7700" stroke-width="1" stroke-opacity="0.8"/>
        <text x="14" y="18" class="mono" font-size="11" fill="#FF8800" font-weight="bold">⚡ DIRECT (yt-dlp)</text>
      </g>
      <!-- Pill 2: Web Engine -->
      <g transform="translate(156, 0)">
        <rect width="168" height="28" rx="6" fill="#0F131C" stroke="#00E5FF" stroke-width="1" stroke-opacity="0.8"/>
        <text x="14" y="18" class="mono" font-size="11" fill="#00E5FF" font-weight="bold">🌐 WEB (Playwright)</text>
      </g>
      <!-- Pill 3: Mutagen ID3 -->
      <g transform="translate(334, 0)">
        <rect width="140" height="28" rx="6" fill="#0F131C" stroke="#8A2BE2" stroke-width="1" stroke-opacity="0.8"/>
        <text x="14" y="18" class="mono" font-size="11" fill="#B76EFF" font-weight="bold">🏷️ ID3 + ARTWORK</text>
      </g>
    </g>
  </g>

  <!-- Right Side: Equalizer / Spectrum Visualizer Panel -->
  <g transform="translate(565, 75)">
    <!-- Equalizer Terminal Box -->
    <rect width="385" height="190" rx="10" fill="#090B10" stroke="#1F2937" stroke-width="1.2"/>
    <rect width="385" height="26" rx="10" fill="#111622" stroke="#1F2937" stroke-width="1"/>
    <text x="14" y="17" class="mono" font-size="10" fill="#6B7280" font-weight="bold">SPECTROGRAM ANALYZER // 320 KBPS VBR</text>
    <text x="320" y="17" class="mono" font-size="9.5" fill="#FF7700" font-weight="bold">48.0 kHz</text>

    <!-- Spectrum Bars Grid -->
    <g transform="translate(20, 168) scale(1, -1)">
      <!-- Bar series (simulating dynamic audio frequencies) -->
      <rect x="0" y="0" width="7" height="42" rx="2" fill="url(#barGrad)"/>
      <rect x="11" y="0" width="7" height="68" rx="2" fill="url(#barGrad)"/>
      <rect x="22" y="0" width="7" height="95" rx="2" fill="url(#barGrad)"/>
      <rect x="33" y="0" width="7" height="122" rx="2" fill="url(#barGrad)" filter="url(#softGlow)"/>
      <rect x="44" y="0" width="7" height="78" rx="2" fill="url(#barGrad)"/>
      <rect x="55" y="0" width="7" height="105" rx="2" fill="url(#barGrad)"/>
      <rect x="66" y="0" width="7" height="54" rx="2" fill="url(#barGrad)"/>
      <rect x="77" y="0" width="7" height="88" rx="2" fill="url(#barGrad)"/>
      <rect x="88" y="0" width="7" height="118" rx="2" fill="url(#barGrad)" filter="url(#softGlow)"/>
      <rect x="99" y="0" width="7" height="92" rx="2" fill="url(#barGrad)"/>
      <rect x="110" y="0" width="7" height="64" rx="2" fill="url(#barGrad)"/>
      <rect x="121" y="0" width="7" height="110" rx="2" fill="url(#barGrad)"/>
      <rect x="132" y="0" width="7" height="126" rx="2" fill="url(#barGrad)" filter="url(#softGlow)"/>
      <rect x="143" y="0" width="7" height="84" rx="2" fill="url(#barGrad)"/>
      <rect x="154" y="0" width="7" height="58" rx="2" fill="url(#barGrad)"/>
      <rect x="165" y="0" width="7" height="96" rx="2" fill="url(#barGrad)"/>
      <rect x="176" y="0" width="7" height="114" rx="2" fill="url(#barGrad)"/>
      <rect x="187" y="0" width="7" height="72" rx="2" fill="url(#barGrad)"/>
      <rect x="198" y="0" width="7" height="128" rx="2" fill="url(#barGrad)" filter="url(#softGlow)"/>
      <rect x="209" y="0" width="7" height="86" rx="2" fill="url(#barGrad)"/>
      <rect x="220" y="0" width="7" height="60" rx="2" fill="url(#barGrad)"/>
      <rect x="231" y="0" width="7" height="102" rx="2" fill="url(#barGrad)"/>
      <rect x="242" y="0" width="7" height="118" rx="2" fill="url(#barGrad)"/>
      <rect x="253" y="0" width="7" height="74" rx="2" fill="url(#barGrad)"/>
      <rect x="264" y="0" width="7" height="108" rx="2" fill="url(#barGrad)"/>
      <rect x="275" y="0" width="7" height="80" rx="2" fill="url(#barGrad)"/>
      <rect x="286" y="0" width="7" height="52" rx="2" fill="url(#barGrad)"/>
      <rect x="297" y="0" width="7" height="90" rx="2" fill="url(#barGrad)"/>
      <rect x="308" y="0" width="7" height="115" rx="2" fill="url(#barGrad)"/>
      <rect x="319" y="0" width="7" height="65" rx="2" fill="url(#barGrad)"/>
      <rect x="330" y="0" width="7" height="38" rx="2" fill="url(#barGrad)"/>
    </g>

    <!-- Overlay Diagnostic HUD -->
    <g transform="translate(24, 42)">
      <text x="0" y="0" class="mono" font-size="9" fill="#00E5FF" opacity="0.85">ENC: libmp3lame // VBR-0</text>
      <text x="0" y="14" class="mono" font-size="9" fill="#9CA3AF">DEMUX: ffmpeg audio/best</text>
      <text x="0" y="28" class="mono" font-size="9" fill="#9CA3AF">APIC: ID3v2.3 500x500 COVER</text>
    </g>
  </g>

  <!-- Bottom Pipeline Flow Ticker -->
  <g transform="translate(50, 302)">
    <text x="0" y="0" class="mono" font-size="10" fill="#4B5563">FLOW:</text>
    <text x="45" y="0" class="mono" font-size="10" fill="#FF7700">SOURCE URL</text>
    <text x="125" y="0" class="mono" font-size="10" fill="#4B5563">→</text>
    <text x="145" y="0" class="mono" font-size="10" fill="#00E5FF">ENGINE ROUTER</text>
    <text x="248" y="0" class="mono" font-size="10" fill="#4B5563">→</text>
    <text x="268" y="0" class="mono" font-size="10" fill="#FF7700">FFMPEG TRANSCODE</text>
    <text x="395" y="0" class="mono" font-size="10" fill="#4B5563">→</text>
    <text x="415" y="0" class="mono" font-size="10" fill="#B76EFF">MUTAGEN TAGGER</text>
    <text x="532" y="0" class="mono" font-size="10" fill="#4B5563">→</text>
    <text x="552" y="0" class="mono" font-size="10" fill="#00FF66">TARGET MP3 ARTIFACT</text>
  </g>
</svg>
